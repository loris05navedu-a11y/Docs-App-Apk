<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Page introuvable · DocsApp Suite</title>
<style>
  :root { --bg: #F1F5F9; --card: #FFFFFF; --line: #E2E8F0; --text: #0F172A; --muted: #64748B; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0B1220; --card: #111A2E; --line: #24324D; --text: #E2E8F0; --muted: #94A3B8; }
  }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 Roboto, "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
  main { max-width: 560px; margin: 24px auto; padding: 28px 24px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  @media (max-width: 600px) { main { margin: 16px; } }
  .brand { margin: 0 0 8px; font-size: 13px; letter-spacing: .3px; color: var(--muted); }
  h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.25; }
</style>
</head>
<body>
<main>
  <p class="brand">DocsApp Suite</p>
  <h1>Page introuvable</h1>
  <p>Ce lien ne mène nulle part. Pour ouvrir un document partagé, utilisez le lien de votre e-mail d’invitation.</p>
</main>
</body>
</html>
