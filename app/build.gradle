plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.docssuite"
    compileSdk 35

    defaultConfig {
        applicationId "com.docssuite"
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName "4.1.0"

        // Seuls les processeurs des téléphones : les variantes x86 du moteur
        // de reconnaissance de texte (émulateurs) doubleraient la taille de l'APK.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        compose true
    }

    // Bibliothèques natives compressées dans l'APK : fichier à télécharger
    // bien plus léger, Android les décompresse une fois à l'installation.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.0'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.activity:activity-compose:1.8.0'
    implementation 'androidx.navigation:navigation-compose:2.7.6'

    implementation project(':modules:core')
    implementation project(':modules:text-editor')
    implementation project(':modules:spreadsheet')
    implementation project(':modules:presentation')
    implementation project(':modules:pdf')
    implementation project(':modules:media')
    implementation project(':modules:converter')
    implementation project(':modules:transfer')
    implementation project(':modules:scanner')
    implementation project(':modules:pdftools')
    implementation project(':modules:library')
    implementation project(':modules:backup')
    implementation project(':modules:ocr')
    implementation project(':modules:recorder')
    implementation project(':modules:tasks')
    implementation project(':modules:reader')
    implementation project(':modules:templates')
}
