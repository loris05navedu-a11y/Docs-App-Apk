plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.docssuite.core"
    compileSdk 35

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.0'
    }
}

dependencies {
    api 'androidx.compose.ui:ui:1.6.0'
    api 'androidx.compose.foundation:foundation:1.6.0'
    api 'androidx.compose.animation:animation:1.6.0'
    api 'androidx.compose.material3:material3:1.1.0'
    api 'androidx.compose.material:material-icons-extended:1.6.0'
    testImplementation 'junit:junit:4.13.2'
}
