plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.docssuite.core"
    compileSdk 35

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.0'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    api project(':modules:fileformats')

    api 'androidx.core:core-ktx:1.12.0'
    api 'androidx.activity:activity-compose:1.8.0'

    // Les artefacts Compose doivent rester accordés entre eux. Mélanger des
    // versions ne casse pas la compilation : chaque bibliothèque appelle des
    // méthodes internes des autres, et le désaccord ne se voit qu'au premier
    // rendu, sous forme de NoSuchMethodError. Le BOM fixe le jeu complet.
    api platform('androidx.compose:compose-bom:2024.02.01')
    api 'androidx.compose.ui:ui'
    api 'androidx.compose.foundation:foundation'
    api 'androidx.compose.animation:animation'
    api 'androidx.compose.material3:material3'
    api 'androidx.compose.material:material-icons-extended'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
