plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.docssuite.collab"
    compileSdk 35

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.0'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // Captures d'écran à la demande : ./gradlew … -Pscreenshots=dossier
                if (project.hasProperty('screenshots')) {
                    systemProperty 'screenshots', project.property('screenshots')
                }
                // Les tests contre les émulateurs Firebase : -PfirebaseEmulators=true
                systemProperty 'firebaseEmulators', project.findProperty('firebaseEmulators') ?: 'false'
            }
        }
    }
}

dependencies {
    api project(':modules:core')
    // Copier un document de l'app vers un document partagé, et l'inverse.
    implementation project(':modules:text-editor')

    // Comptes et base temps réel. Configurées à l'exécution (voir FirebaseSetup) :
    // sans google-services.json, l'app se construit quand même.
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    // « Continuer avec Google », par le gestionnaire d'identifiants d'Android.
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.test.ext:junit:1.1.5'
    // Le rendu d'écrans en test réclame une activité hôte, fournie par
    // `ui-test-manifest`, qui n'existe qu'en debug : ces tests vivent donc
    // dans `src/testDebug`.
    testDebugImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
